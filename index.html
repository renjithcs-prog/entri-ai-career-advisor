<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Career Advisor | Entri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="mesh" aria-hidden="true"></div>

    <header class="header">
      <div class="brand">
        <img class="brand__logo" src="entri-logo.svg" alt="Entri" aria-hidden="true" />
        <div>
          <p class="brand__name">Entri</p>
          <p class="brand__tag">AI Career Advisor</p>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <span class="theme-toggle__icon">🌙</span>
      </button>
    </header>

    <main class="main" id="main" tabindex="-1">
      <div id="screen" class="screen" aria-live="polite" aria-atomic="true"></div>
    </main>

    <div id="sr-announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
